site_name: anacapad SOAP/UPnP reference
site_description: Reverse-engineered SOAP/UPnP surface of anacapad 86.10-80260 (model-9 / Playbar)
docs_dir: reference
site_dir: site
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.action.view
plugins:
  - search
markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true
nav:
  - Overview: index.md
  - Architecture: architecture.md
  - Availability matrix: availability-matrix.md
  - State variables: state-variables.md
  - Events: events.md
  - Errors: errors.md
  - URI formats: uri-formats.md
  - Payload formats: payload-formats.md
  - HTTP / non-SOAP: http-api.md
  - muse API (v1): muse-api.md
  - Firmware differences: firmware-differences.md
  - Subsystems: subsystems.md
  - Services:
      - AlarmClock: services/alarm-clock.md
      - AudioIn: services/audio-in.md
      - AVTransport: services/av-transport.md
      - ConnectionManager: services/connection-manager-renderer.md
      - ConnectionManager: services/connection-manager-server.md
      - ContentDirectory: services/content-directory.md
      - Control: services/control.md
      - DeviceProperties: services/device-properties.md
      - GroupManagement: services/group-management.md
      - GroupRenderingControl: services/group-rendering-control.md
      - HTControl: services/ht-control.md
      - MusicServices: services/music-services.md
      - QPlay: services/qplay.md
      - Queue: services/queue.md
      - RenderingControl: services/rendering-control.md
      - SystemProperties: services/system-properties.md
      - VirtualLineIn: services/virtual-line-in.md
      - ZoneGroupTopology: services/zone-group-topology.md
